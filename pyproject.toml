[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funnel"
version = "1.0.0"
description = "Tracking, funil, atribuição e testes A/B de abertura de conta digital (GA4 + BigQuery + GTM)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
